name: API client drift

# Fails if the vendored OpenAPI schema or the generated client has drifted from
# the backend's source schema (Foxugly/Fleet_server owns openapi-schema.yaml).
# This frontend vendors a COPY at openapi/fleet-api.yaml and generates the typed
# client (src/app/api) from it; this guard re-vendors, regenerates and fails on
# any difference. No secret needed: the backend repo is public.

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frontend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the backend's schema file is needed. No `token:` (public repo).
      - name: Checkout backend schema
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Foxugly/Fleet_server
          ref: main
          path: backend
          sparse-checkout: |
            openapi-schema.yaml
          sparse-checkout-cone-mode: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      # openapi-generator-cli runs a Java jar.
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      # Restored AFTER `npm ci`, which wipes node_modules. Key = generator version
      # (openapitools.json); bump both together.
      - name: Cache OpenAPI generator JAR
        id: generator-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/@openapitools/openapi-generator-cli/versions
          key: openapi-generator-7.21.0

      - name: Download generator JAR (cache miss, 3 tries)
        if: steps.generator-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            npx openapi-generator-cli version-manager set 7.21.0 && exit 0
            echo "download attempt $i failed"; sleep 10
          done
          exit 1

      - name: Check client is in sync with the backend schema
        run: |
          cp backend/openapi-schema.yaml openapi/fleet-api.yaml
          npm run api:gen
          # --ignore-cr-at-eol: only real content changes should fail the guard.
          if git diff --ignore-cr-at-eol --quiet -- openapi/ src/app/api/; then
            echo "OpenAPI client in sync with the backend"
          else
            echo "::error::OpenAPI client out of sync with the backend. Re-vendor openapi-schema.yaml to openapi/fleet-api.yaml, run 'npm run api:gen' and commit."
            git diff --ignore-cr-at-eol --stat -- openapi/ src/app/api/
            git diff --ignore-cr-at-eol -- openapi/ src/app/api/ | head -120
            exit 1
          fi
