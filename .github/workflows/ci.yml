name: CI

# On a PR: this file alone (its job name `test` is the check branch protection
# requires). On a push to main: called by deploy.yml (`uses: ./.github/workflows/ci.yml`),
# once; a `push` trigger here would run the suite twice.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a PR cancels the older run; a run for main never cancels
# another (that would fail the deploy of the older commit): one group per SHA.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Unit tests (Vitest)
        run: npx ng test --watch=false
      - name: Build
        run: npm run build
